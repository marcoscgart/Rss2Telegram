name: Cron Action
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: rss2telegram
  cancel-in-progress: false

jobs:
  rss2telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Baixa o histórico (rss2telegram.db) da última execução bem-sucedida.
      # Se não existir (primeira execução), o passo falha e o script roda em
      # modo DRYRUN: só registra os links, sem postar.
      - name: Download history
        id: download
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: cron.yml
          workflow_conclusion: success
          name: rss2telegram
          path: .
          if_no_artifact_found: fail

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Requirements
        run: pip install -r requirements.txt

      - name: Run Rss to Telegram
        run: python rss2telegram.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DESTINATION: ${{ vars.DESTINATION }}
          URL: ${{ vars.URL }}
          EMOJIS: ${{ vars.EMOJIS }}
          MESSAGE_TEMPLATE: ${{ vars.MESSAGE_TEMPLATE }}
          BUTTON_TEXT: ${{ vars.BUTTON_TEXT }}
          PARAMETERS: ${{ vars.PARAMETERS }}
          DRYRUN: ${{ steps.download.outcome }}

      - name: Upload history
        uses: actions/upload-artifact@v4
        with:
          name: rss2telegram
          path: rss2telegram.db
          retention-days: 90
